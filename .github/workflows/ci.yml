name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: >-
          xcodebuild
          -scheme laya-mlx-swift
          -destination 'platform=macOS,arch=arm64'
          -skipPackagePluginValidation
          test
